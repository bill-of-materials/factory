name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
      has_images: ${{ steps.images.outputs.has_images }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: images
        shell: bash
        run: |
          # generate the image list
          # only rebuild and test modified oci-images
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi
          if [[ -n "$BASE_SHA" ]]; then
            CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          else
            CHANGED=$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")
          fi
          DIRS=$(
            printf '%s\n' "${CHANGED:-}" \
            | awk -F/ 'NF > 1 {print $1}' \
            | sort -u \
            | while read -r d; do
                test -f "$d/Dockerfile" && echo "$d"
              done || true
          )

          # Each image dir may declare its target architectures in a
          # "platforms.txt" file (comma-separated, e.g. "linux/amd64,linux/arm64").
          # Images without one fall back to DEFAULT_PLATFORMS. Every declared
          # platform gets its own matrix entry so each arch is actually built
          # and validated, instead of only the runner's native arch.
          DEFAULT_PLATFORMS="linux/amd64,linux/arm64,linux/arm/v7"

          MATRIX="[]"
          while read -r d; do
            [[ -z "$d" ]] && continue
            PLATFORMS_FILE="$d/platforms.txt"
            if [[ -f "$PLATFORMS_FILE" ]]; then
              PLATFORMS=$(tr -d '[:space:]' < "$PLATFORMS_FILE")
            else
              PLATFORMS="$DEFAULT_PLATFORMS"
            fi
            ENTRIES=$(
              printf '%s' "$PLATFORMS" \
              | jq -R -c --arg img "$d" \
                  'split(",") | map(select(length > 0)) | map({image: $img, platform: .})'
            )
            MATRIX=$(jq -c -n --argjson a "$MATRIX" --argjson b "$ENTRIES" '$a + $b')
          done <<< "$DIRS"

          if [[ "$MATRIX" == "[]" ]]; then
            echo 'matrix=[{"image":"__none__","platform":"__none__"}]' >> "$GITHUB_OUTPUT"
            echo 'has_images=false' >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
            echo 'has_images=true' >> "$GITHUB_OUTPUT"
          fi
          echo "Matrix: $MATRIX"

  structure-test:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: No OCI images changed
        if: matrix.image == '__none__'
        run: echo "Nothing to validate"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7
        if: matrix.image != '__none__'

      - name: Set up QEMU
        if: matrix.image != '__none__'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Buildx
        if: matrix.image != '__none__'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image (${{ matrix.platform }})
        if: matrix.image != '__none__'
        run: |
          test -n "${{ matrix.image }}"
          IMAGE_NAME=$(basename "${{ matrix.image }}")
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --load \
            -t local/${IMAGE_NAME}:test \
            "${{ matrix.image }}"

      - name: Install Container Structure Test
        if: matrix.image != '__none__'
        run: |
          VERSION=1.22.1
          curl -fsSL \
            -o container-structure-test \
            https://github.com/GoogleContainerTools/container-structure-test/releases/download/v${VERSION}/container-structure-test-linux-amd64
          chmod +x container-structure-test
          sudo mv container-structure-test /usr/local/bin/

      - name: Run Container Structure Test (${{ matrix.platform }})
        if: matrix.image != '__none__'
        run: |
          IMAGE_NAME=$(basename "${{ matrix.image }}")
          container-structure-test test \
            --image local/${IMAGE_NAME}:test \
            --config ${{ matrix.image }}/structure-test.yaml

  validation-required:
    needs:
      - discover
      - structure-test
    runs-on: ubuntu-latest
    if: ${{ always() }}

    steps:
      - name: Check validation results
        shell: bash
        run: |
          echo "discover:       ${{ needs.discover.result }}"
          echo "structure-test: ${{ needs.structure-test.result }}"

          if [[ "${{ needs.discover.result }}" != "success" ]]; then
            echo "ERROR: discover did not succeed"
            exit 1
          fi

          if [[ "${{ needs.structure-test.result }}" != "success" ]]; then
            echo "ERROR: structure-test did not succeed"
            exit 1
          fi

          echo "All validation checks passed."
