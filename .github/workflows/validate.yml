name: validate

on:
  pull_request:

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=GoogleContainerTools/container-structure-test
  CST_VERSION: v1.22.1

jobs:
  ci-tests:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Unit tests
        run: (cd .github/scripts && python3 -m unittest discover -s tests -t . -v)

      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  discover:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
      has_images: ${{ steps.images.outputs.has_images }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: images
        run: |
          python3 .github/scripts/ci.py pr-matrix \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} >> "$GITHUB_OUTPUT"

  structure-test:
    name: structure-test (${{ matrix.image }}, ${{ matrix.platform }})
    needs: discover
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: No OCI images changed
        if: matrix.image == '__none__'
        run: echo "Nothing to validate"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: matrix.image != '__none__'

      - name: Set up QEMU
        if: matrix.image != '__none__' && matrix.qemu
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Buildx
        if: matrix.image != '__none__'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image (${{ matrix.platform }})
        if: matrix.image != '__none__'
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --load \
            -t "local/${{ matrix.image }}:test" \
            "${{ matrix.image }}"

      - name: Install Container Structure Test
        if: matrix.image != '__none__'
        run: |
          curl -fsSL \
            -o container-structure-test \
            "https://github.com/GoogleContainerTools/container-structure-test/releases/download/${CST_VERSION}/container-structure-test-linux-${{ matrix.cst_arch }}"
          chmod +x container-structure-test
          sudo mv container-structure-test /usr/local/bin/

      - name: Run Container Structure Test (${{ matrix.platform }})
        if: matrix.image != '__none__'
        run: |
          container-structure-test test \
            --platform "${{ matrix.platform }}" \
            --image "local/${{ matrix.image }}:test" \
            --config "${{ matrix.image }}/structure-test.yaml"

  validation-required:
    needs:
      - ci-tests
      - discover
      - structure-test
    runs-on: ubuntu-24.04
    if: ${{ always() }}

    steps:
      - name: Check validation results
        shell: bash
        run: |
          echo "ci-tests:       ${{ needs.ci-tests.result }}"
          echo "discover:       ${{ needs.discover.result }}"
          echo "structure-test: ${{ needs.structure-test.result }}"

          for job in ci-tests discover structure-test; do
            case "$job" in
              ci-tests) result="${{ needs.ci-tests.result }}" ;;
              discover) result="${{ needs.discover.result }}" ;;
              structure-test) result="${{ needs.structure-test.result }}" ;;
            esac
            if [[ "$result" != "success" ]]; then
              echo "ERROR: $job did not succeed"
              exit 1
            fi
          done

          echo "All validation checks passed."
